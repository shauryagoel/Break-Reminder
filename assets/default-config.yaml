interval_minutes: 60
duration_seconds: 30
postpone_minutes: [10, 15]
pause_media: false # Pause supported media when a break starts; leave it paused afterward.
appearance:
  title: "Time for a break"
  message: "Step away from your screen and rest your eyes."
  background_color: "#101827"
  background_transparency_percent: 15 # 0 is opaque; 100 is fully transparent.
  text_color: "#F8FAFC"
  accent_color: "#69D5B2"
