[package]
name = "break-reminder"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "default_fonts", "accesskit", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize", "serialize"] }
time = "0.3"
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11"] }
tray-icon = { version = "=0.25.1", default-features = false, features = ["ksni"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSResponder", "NSRunningApplication", "NSScreen", "NSView", "NSWindow"] }
objc2-foundation = "0.3.2"
raw-window-handle = "0.6.2"
